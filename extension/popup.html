<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShieldIntern</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 350px;
        min-height: 180px;
        padding: 20px;
        background: #050e1d;
        color: #f1f5f9;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      h1 {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }

      .subtitle {
        color: #64748b;
        font-size: 12px;
        margin-bottom: 16px;
      }

      #placeholder,
      #loading,
      #error {
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: #94a3b8;
        font-size: 13px;
        line-height: 1.5;
      }

      #error {
        border-color: rgba(239, 68, 68, 0.2);
        background: rgba(239, 68, 68, 0.07);
        color: #ef4444;
      }

      #result {
        display: none;
      }

      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .score-circle {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 800;
        flex-shrink: 0;
        border: 2px solid;
      }

      .verdict-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      #flags {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.07);
      }

      .flag-item {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 6px;
        padding-left: 14px;
        position: relative;
      }

      .flag-item::before {
        content: "●";
        position: absolute;
        left: 0;
        font-size: 7px;
        top: 5px;
      }

      .flag-item.red::before { color: #ef4444; }
      .flag-item.green::before { color: #10b981; }
    </style>
  </head>
  <body>
    <h1>ShieldIntern</h1>
    <p class="subtitle">Job Scam Detector</p>

    <div id="placeholder">Right-click selected text on any page and choose "Analyze with ShieldIntern" to check it.</div>
    <div id="loading" style="display:none;">Analyzing selected text — this takes a few seconds...</div>
    <div id="error" style="display:none;"></div>

    <div id="result">
      <div class="score-row">
        <div id="scoreCircle" class="score-circle"></div>
        <div>
          <div id="verdictBadge" class="verdict-badge"></div>
          <div id="scoreText" style="font-size:12px; color:#94a3b8;"></div>
        </div>
      </div>
      <div id="flags"></div>
    </div>
    <button id="clearBtn" style="display:none; width:100%; margin-top:14px; padding:8px; background:transparent; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#64748b; font-size:11px; cursor:pointer;">Clear Result</button>

    <script src="popup.js"></script>
  </body>
</html>
